<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../style.css">
    <title>Carrito FoodStore</title>
</head>
<body>
    <header>
        <div class="container-header">
           <h2 class="logo"><span class="logo-food">Food</span><span class="logo-store">Store</span></h2>
            <nav class="menu">
                <ul>
                    <li><a href="../home/home.html">Catalogo</a></li>
                    <li><a href="#carrito">Carrito</a></li>
                </ul>
            </nav>

        </div>
    </header>
    <main class="cart-container">
            <section class="cart-items">
                <h2>Mi Carrito</h2>
                <div id="cart-list"></div>
                <h3 id="cart-total"></h3>
                <div id="empty-cart" class="empty-cart hidden">
                    <p>Tu carrito está vacío</p>
                    <a href="../home/home.html" class="btn-volver">Ver catálogo</a>
                </div>
            </section>
            <aside class="cart-resumen">
                <h3>Resumen</h3>
                <p class="resumen-subtotal">Subtotal: $<span id="resumen-subtotal">0</span></p>
                <p class="resumen-total">Total: $<span id="resumen-total">0</span></p>

                <button id="btn-confirmar" class="btn-confirmar">Confirmar venta</button>
                <button id="btn-vaciar" class="btn-vaciar">Vaciar carrito</button>
            </aside>
        
    </main>

    <script type="module" src="../cart/cart.ts"></script>
</body>
</html>
